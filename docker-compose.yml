services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportscal
      POSTGRES_PASSWORD: sportscal
      POSTGRES_DB: sportscal
    ports:
      - "5432:5432"
    volumes:
      - sportscal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportscal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sportscal-pg:
